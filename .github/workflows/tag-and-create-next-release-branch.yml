name: Tag and Create Next Release Branch

on:
  push:
    branches:
      - main

permissions:
  contents: write    # for creating the branch

jobs:
  bump-and-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.2.0
        with:
          versionSpec: '6.3.x'

      - name: Determine Version
        id: gitversion # step id used as a reference for output values
        uses: gittools/actions/gitversion/execute@v3.2.0
        with:
          useConfigFile: true
          configFilePath: './.github/config/GitVersion.yml'
     
      - name: Tag this commit
        run: |
          TAG=${{ steps.gitversion.outputs.majorMinorPatch }}
          echo "Tagging main with $TAG"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Determine next minor version
        id: next
        run: |
          MAJOR=${{ steps.gitversion.outputs.major }}
          MINOR=${{ steps.gitversion.outputs.minor }}
          PATCH=${{ steps.gitversion.outputs.patch }}
          NEXT_PATCH=$((PATCH + 1))
          NEXT_RELEASE="$MAJOR.$MINOR.$NEXT_PATCH"
          echo "next-release=$NEXT_RELEASE" >> $GITHUB_OUTPUT

      - name: Create releases/$NEXT branch
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_RELEASE: ${{ steps.next.outputs.next-release }}
        run: |
          echo "Creating branch: releases/$NEXT_RELEASE"
          gh api \
            -X POST /repos/${{ github.repository }}/git/refs \
            -f ref="refs/heads/releases/$NEXT_RELEASE" \
            -f sha="${{ github.sha }}"
          
      - name: Re-dispatch enforce workflow for feature branches
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.WORKFLOW_ACCESS_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            
            // 1) list open PRs
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              per_page: 100
            });
            
            for (const pr of prs) {
              const head = pr.head.ref;
              if (!head.startsWith("features/")) continue;
            
              console.log(`↻ Re-dispatching enforce-workflow on ${head}`);
            
              // 2) dispatch the enforce workflow on that branch
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: "enforce-branching-strategy.yml",
                ref: head
              });
            }