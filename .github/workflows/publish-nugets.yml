name: Publish NuGets

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.2.0
        with:
          versionSpec: '6.3.x'

      - name: Determine Version
        id: version_step # step id used as a reference for output values
        uses: gittools/actions/gitversion/execute@v3.2.0
        with:
          useConfigFile: true
          configFilePath: './github/config/GitVersion.yml'
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.version_step.outputs.semVer }}
        
      - name: Run Tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack Release
        run: dotnet pack --configuration Release --no-build --output ./nupkgs -p:Version=${{ steps.version_step.outputs.semVer }} 

      - name: Upload NuGet packages (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./nupkgs/*.nupkg

      - name: Create Git Tag when Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          TAG=${{ steps.version_step.outputs.semVer }}
          echo "Tagging commit with $TAG"
          git tag $TAG
          git push origin $TAG
